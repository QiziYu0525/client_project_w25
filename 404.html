<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/html5reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>STUDENT SUCCESS PORTAL</title>
</head>

<body>
    <header>
        <img id="logo" src="images/UMSI_signature_vertical_informal_solidblue.jpg" width="100" alt="UMSI Logo">
        <nav>
            <ul>
                <li><a class="active" href="index.html">Home</a></li>
                <li><a href="page_1.html">Food Pantry</a></li>
                <li><a href="page_2.html">Study Spaces</a></li>
                <li><a href="page_3.html">MSI Advising Resource Site</a></li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <div>
            <h1>Oops! 404</h1>
            <p>Looks like this page went on vacation. Let's get you back on track.</p>
        </div>
    </main>
    

    <style>
        p {
            text-align: center;
        }

        #emailDiv {
            display: none;
        }
    </style>

    <footer>
        <p><a href="https://sites.google.com/umich.edu/msiacademicadvising/student-support-resources">UMSI Academic
                Advising</a> <span id="year"></span> | <a
                href="mailto:umsi.advising.msi@umich.edu">umsi.advising.msi@umich.edu</a></p>
        <fieldset>
            <legend>Email subscriptions</legend>
            <div id="check">
                <label>
                    <input type="checkbox" name="subscribe" id="subscribe">
                    Check to toggle the email field.
                </label>
            </div>

            <div id="emailDiv">
                <label>
                    Email Address:
                    <input type="text" name="email" id="email">
                </label>
            </div>

            <input type="submit" value="submit">
        </fieldset>
    </footer>
</body>
<script>
    document.getElementById("year").innerHTML = new Date().getFullYear();
    document.getElementById("subscribe").addEventListener("click", function () {
        console.log('this works');
        if (document.getElementById("subscribe").checked == true) {
            console.log("item is checked!");
            document.getElementById("emailDiv").style.display = "block";
        }
        else { document.getElementById("emailDiv").style.display = "none"; }
        document.querySelector("input[type='submit']").addEventListener("click", function (event) {
            event.preventDefault();
            const emailInput = document.getElementById("email").value;
            if (emailInput) {
                alert("Successfully subscribed!");
            } else {
                alert("Please enter a valid email address.");
            }
        });
    })
</script>

</html>
